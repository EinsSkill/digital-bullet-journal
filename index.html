<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Digitales Bullet Journal 2027 – ein persönliches Buch für iPad und Handy.">
<meta name="theme-color" content="#FAF7F0">
<title>Mein Jahr 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Caveat:wght@400;600;700&family=Architects+Daughter&family=Karla:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="desk">
  <div id="book" class="cover-mode">
    <button class="turn prev" id="tPrev" aria-label="Zurückblättern"><i></i></button>
    <button class="turn next" id="tNext" aria-label="Weiterblättern"><i></i></button>
    <div id="ytabs" role="tablist" aria-label="Jahresbereich"></div>
    <div id="spread">
      <div class="page left"><div class="page-inner" id="pgL"></div><div class="folio"></div></div>
      <div class="page right"><div class="page-inner" id="pgR"></div><div class="folio"></div></div>
    </div>
    <div id="flip" aria-hidden="true"></div>
    <div id="marks" role="tablist" aria-label="Monats-Lesezeichen"></div>
  </div>
</div>

<div id="pager">
  <button id="pPrev" aria-label="Vorherige Seite"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
  <span class="pl" id="pLabel"></span>
  <button id="pNext" aria-label="Nächste Seite"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<div id="sync"><span class="dot"></span><span id="syncTxt">Alles gesichert</span></div>
<div id="corner">
  <button id="btnToc">Inhalt</button>
  <button id="btnTheme">Nachtlicht</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="veil"></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
